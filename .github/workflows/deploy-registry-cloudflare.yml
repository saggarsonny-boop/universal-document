name: Deploy Registry to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/registry-static/**'
      - 'spec/governance/**'
      - '.github/workflows/deploy-registry-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: deploy-registry
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        working-directory: apps/registry-static
        run: |
          npm install
          npm run build

      - name: Create Cloudflare Pages project (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/registry-static
          command: pages project create ud-registry --production-branch=main
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/registry-static
          command: pages deploy dist --project-name=ud-registry --commit-dirty=true

      - name: Attach custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler 3.x has no `pages domain add` subcommand (it errors with
          # "Unknown arguments" but was previously masked by continue-on-error).
          # Use the Cloudflare API directly instead, which also auto-creates
          # the required DNS record when the zone is on Cloudflare.
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ud-registry/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"registry.universaldocument.org"}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Domain attached (or already attached)."
          elif echo "$body" | grep -q '"code":8000007\|already exists\|already associated'; then
            echo "Domain already attached — treating as success."
          else
            echo "::error::Failed to attach custom domain (HTTP $http_code)"
            exit 1
          fi
