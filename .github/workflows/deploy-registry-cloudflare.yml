name: Deploy Registry to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/registry-static/**'
      - 'spec/governance/**'
      - '.github/workflows/deploy-registry-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: deploy-registry
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        working-directory: apps/registry-static
        run: |
          npm install
          npm run build

      - name: Create Cloudflare Pages project (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/registry-static
          command: pages project create ud-registry --production-branch=main
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/registry-static
          command: pages deploy dist --project-name=ud-registry --commit-dirty=true

      - name: Attach custom domain
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/registry-static
          command: pages domain add registry.universaldocument.org --project-name=ud-registry
        continue-on-error: true
